<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>WhatsFlow AI — Painel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>WhatsFlow AI</h1>

  <section>
    <h2>Contatos</h2>
    <table id="contacts-table">
      <thead>
        <tr><th>Nome</th><th>Telefone</th><th></th></tr>
      </thead>
      <tbody id="contacts-body"></tbody>
    </table>
    <button id="add-contact">+ Adicionar contato</button>
    <button id="save-contacts">Salvar contatos</button>
    <span id="contacts-status" class="status"></span>
  </section>

  <section>
    <h2>Mensagem</h2>
    <textarea id="message-text" rows="6" placeholder="Texto da mensagem..."></textarea>
    <button id="save-message">Salvar mensagem</button>
    <span id="message-status" class="status"></span>
  </section>

  <section>
    <h2>Anexos</h2>
    <div id="attachments-list"></div>
    <input type="file" id="attachments-input" multiple>
    <button id="upload-attachments">Enviar anexos</button>
    <span id="attachments-status" class="status"></span>
  </section>

  <section>
    <h2>Execução</h2>
    <button id="run-button">Executar envio</button>
    <pre id="run-log"></pre>
  </section>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
